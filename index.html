  <script src="/_sdk/5b8ba8d07d23b16e.editing_sdk.js" integrity="sha512-ykf1UtRZqhYZNoJ6shXgcGOkW+ohguwuDj4vCzNYy3Qp/R4fNOlj7N55HSKbIj4nfOJAgE1EZTY3L8mDguPo7g=="></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      const toggle = document.getElementById("menu-toggle");
      const menu = document.getElementById("mobile-menu");
      toggle.addEventListener("click", () => {
        const open = menu.classList.toggle("open");
        toggle.setAttribute("aria-expanded", String(open));
        toggle.setAttribute("aria-label", open ? "Cerrar menú" : "Abrir menú");
      });
      document.querySelectorAll("#mobile-menu a").forEach(link => link.addEventListener("click", () => {
        menu.classList.remove("open");
        toggle.setAttribute("aria-expanded", "false");
      }));
      document.getElementById("wallet-button").addEventListener("click", () => {
        document.getElementById("wallet-button").classList.add("hidden");
        document.getElementById("wallet-status").classList.remove("hidden");
      });
    });
  </script>
