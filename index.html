  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const toggle = document.getElementById("menu-toggle");
      const mobileMenu = document.getElementById("mobile-menu");

      toggle.addEventListener("click", () => {
        const open = mobileMenu.classList.toggle("open");
        toggle.setAttribute("aria-expanded", String(open));
        toggle.setAttribute("aria-label", open ? "Close navigation menu" : "Open navigation menu");
      });

      document.querySelectorAll("#mobile-menu a").forEach((link) => {
        link.addEventListener("click", () => {
          mobileMenu.classList.remove("open");
          toggle.setAttribute("aria-expanded", "false");
          toggle.setAttribute("aria-label", "Open navigation menu");
        });
      });

      const connectWallet = () => {
        document.getElementById("wallet-button").classList.add("hidden");
        document.getElementById("wallet-connected").classList.remove("hidden");
        document.getElementById("mobile-wallet-button").classList.add("hidden");
        document.getElementById("mobile-wallet-connected").classList.remove("hidden");
      };

      document.getElementById("wallet-button").addEventListener("click", connectWallet);
      document.getElementById("mobile-wallet-button").addEventListener("click", connectWallet);
    });
  </script>
